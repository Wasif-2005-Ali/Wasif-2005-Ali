<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0E2A1A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="100%" stop-color="#26A641"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#26A641" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#26A641" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#26A641" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- decorative code brackets, right side -->
  <text x="1090" y="180" font-family="JetBrains Mono, monospace" font-size="150" fill="#39D353" opacity="0.16" text-anchor="middle">&lt;/&gt;</text>
  <circle cx="150" cy="52" r="6" fill="#39D353" opacity="0.7"/>
  <circle cx="178" cy="52" r="6" fill="#26A641" opacity="0.7"/>
  <circle cx="206" cy="52" r="6" fill="#0E4429" opacity="0.9"/>

  <!-- greeting -->
  <text x="80" y="118" font-family="JetBrains Mono, monospace" font-size="30" fill="#7EE787">Hi there, I'm</text>
  <text x="78" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Wasif Ali</text>
  <rect x="80" y="216" width="340" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#C9D1D9">Computer Science Student  ·  Flutter &amp; Django Developer</text>
  <text x="80" y="298" font-family="JetBrains Mono, monospace" font-size="19" fill="#8B949E">Air University, Kamra Campus  ·  Pakistan</text>
</svg>
